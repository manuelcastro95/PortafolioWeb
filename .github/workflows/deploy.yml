name: Deploy Laravel + Vue (EC2)

on:
  push:
    branches:
      - main   # 👈 TU RAMA REAL

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -e

            cd ${{ secrets.APP_PATH }}

            # storage y bootstrap/cache son de www-data para que la app pueda
            # escribir en caliente, pero composer, npm y artisan corren aquí
            # como el usuario SSH y también necesitan escribir ahí. Sin esto,
            # composer install falla en package:discover con "Permission denied".
            devolver_permisos() {
              echo "🔐 Devolviendo storage y bootstrap/cache a www-data"
              sudo chown -R www-data:www-data storage bootstrap/cache
              sudo chmod -R 775 storage bootstrap/cache
            }

            # El trap corre pase lo que pase: si un paso falla a mitad de camino,
            # las carpetas no se quedan en manos del usuario SSH, que dejaría el
            # sitio sin poder escribir logs ni sesiones.
            trap devolver_permisos EXIT

            echo "🔓 Tomando storage y bootstrap/cache para el build"
            sudo chown -R "$(id -un):$(id -gn)" storage bootstrap/cache

            echo "📥 Actualizando código"
            git fetch origin
            git checkout main
            # reset en lugar de pull: el servidor es un espejo de origin, no
            # una copia donde se trabaje. Con pull, cualquier reescritura de
            # historia deja las ramas divergidas y el deploy falla. Esto
            # descarta cambios locales en el servidor, que es lo que se quiere
            # en un destino de despliegue.
            git reset --hard origin/main

            echo "📦 Backend"
            composer install --no-dev --optimize-autoloader

            echo "🎨 Frontend (Vue)"
            npm install
            npm run build

            echo "🧹 Laravel optimize"
            # No se usa optimize:clear porque incluye cache:clear, que abre el
            # store de caché. Si CACHE_DRIVER apunta a un backend que no está
            # disponible en el servidor, el deploy muere ahí. Estos clear/cache
            # solo tocan archivos en bootstrap/cache y storage/framework.
            php artisan config:clear
            php artisan route:clear
            php artisan view:clear

            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "🗄️ Migraciones"
            php artisan migrate --force

            # Los permisos los restaura el trap de arriba, tanto si llegamos
            # hasta aquí como si algún paso falló antes.
            echo "🚀 DEPLOY OK"
          EOF
